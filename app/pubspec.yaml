name: jobtrail
description: Job application tracker with pipeline, interviews, reminders, dashboard and calendar.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  path_provider: ^2.1.5
  path: ^1.9.0
  shared_preferences: ^2.3.4
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  table_calendar: ^3.1.3
  fl_chart: ^0.70.2
  url_launcher: ^6.3.1
  intl: ^0.20.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  logger: ^2.5.0
  package_info_plus: ^9.0.1
  permission_handler: ^13.0.2
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Launcher icon + splash: regenerate with
#   dart run flutter_launcher_icons && dart run flutter_native_splash:create
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/icon.png
  adaptive_icon_background: "#3F51B5"
  adaptive_icon_foreground: assets/branding/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 26

flutter_native_splash:
  color: "#3F51B5"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#3F51B5"
    image: assets/branding/splash_logo.png
